[build-system]
requires = ["setuptools>=42"]
build-backend = "setuptools.build_meta"

[project]
name = "agentforge"
version = "0.1.0"
requires-python = ">=3.10"

[project.optional-dependencies]
# Content guardrail (Step 17e gap E). OPTIONAL on purpose: it pulls heavy ML deps
# (torch / transformers, ~1-2 GB) and the agent runs fine without it (the guardrail
# lazily no-ops). Install with:  pip install -e ".[guardrail]"
#
# We load the injection classifier directly via transformers rather than through the
# LlamaFirewall framework — LlamaFirewall hard-depends on codeshield→semgrep, which
# has no native Windows build. Same capability, Windows-clean, smaller footprint.
#
# Egress note: inference is FULLY LOCAL (no API calls). The default model
# (ProtectAI/deberta-v3-base-prompt-injection-v2) is ungated — a one-time, no-login
# HuggingFace download. (Meta's Prompt Guard 2 is an optional swap via
# AGENT_GUARDRAIL_MODEL_ID, but it is gated: license + hf login.) See workspace
# memory feedback_tool_egress_safety for the full runbook.
guardrail = [
    "torch>=2.4.1",
    "transformers>=4.51.3",
    "huggingface-hub>=0.30.2",
    # DeBERTa-v3's tokenizer (the default ProtectAI model) is SentencePiece-based.
    "sentencepiece>=0.2.0",
    "protobuf>=4.21",
]

# Red-team eval harness (agentforge.redteam) — measures the guardrail against a
# held-out public dataset. Needs the guardrail extra too:  pip install -e ".[guardrail,redteam]"
# pandas/pyarrow load the parquet dataset (no heavy `datasets` lib); matplotlib is
# only for the optional chart (numbers print without it).
redteam = [
    "pandas>=2.0",
    "pyarrow>=14",
    "matplotlib>=3.7",
]

# ML-grade OUTPUT guardrail (issue #24). OPTIONAL: adds Microsoft Presidio + a GLiNER
# zero-shot NER model so the output guardrail catches person NAMES and ADDRESSES (which
# regex structurally cannot) and validates credit cards via Luhn. WITHOUT this extra the
# output guardrail runs on the always-available zero-dep regex engine (no behaviour
# change for a plain clone). Install with:  pip install -e ".[pii]"
#
# Egress note: inference is FULLY LOCAL (no API calls at scan time). There are TWO
# one-time HuggingFace downloads — the PII model (urchade/gliner_multi_pii-v1; Apache-2.0,
# ungated, commercial-OK — pinned so we never pull a CC-BY-NC variant) and GLiNER's
# mDeBERTa-v3 backbone encoder. Telemetry is disabled in the engine builder. torch/
# transformers are shared with the [guardrail] extra (gliner caps transformers; both
# extras remain co-installable). The en_core_web_sm wheel is pinned to match spaCy 3.8.
pii = [
    "presidio-analyzer>=2.2.355",
    "presidio-anonymizer>=2.2.355",
    "spacy>=3.7,<3.9",
    "gliner>=0.2.27",
    "en_core_web_sm @ https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["agentforge*"]
