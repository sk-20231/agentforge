# =============================================================================
# CI Workflow — Unit Tests
# =============================================================================
#
# WHAT THIS DOES:
#   Runs the full unit-test suite on every push and pull request.
#   These tests use mocked OpenAI calls — no real API key needed.
#   Fast gate: if the code is broken, this tells you quickly.
#
#   (This comment used to hard-code a test count. It rotted — it said 127 while
#   the suite was past 400. Counts belong in the badge, which is generated from
#   the run below, not in prose a human has to remember to update.)
#
# WHY TWO SEPARATE WORKFLOWS?
#   This one answers: "Does the code work?"
#   eval.yml answers: "Is the AI still any good?"
#   Separating them means every PR gets fast feedback without burning
#   API credits on quality checks that only matter when merging to main.
#
# AI CONCEPT — Testing AI systems:
#   Traditional software: unit tests check correctness (right answer or wrong).
#   AI systems: unit tests check that the plumbing works (does the function
#   return something? does it call the right methods?). They can't tell you
#   if the RAG retrieval quality degraded — that requires real eval.
#   This is why we need BOTH workflows.
#
# =============================================================================

name: CI — Unit Tests

on:
  push:
    branches: ["**"]        # every branch, every push
  pull_request:
    branches: ["**"]        # every PR, regardless of target branch

jobs:
  test:
    name: Run unit tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest

    # Needed only by the badge step below, which force-pushes a one-file
    # `badges` branch. Everything else here is read-only.
    permissions:
      contents: write

    strategy:
      matrix:
        python-version: ["3.11"]   # expand to ["3.10", "3.11", "3.12"] later

    steps:
      # -----------------------------------------------------------------------
      # 1. Check out the code
      # -----------------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # -----------------------------------------------------------------------
      # 2. Set up Python with pip caching
      #    The cache key includes requirements files — any change to deps
      #    invalidates the cache and re-installs from scratch.
      # -----------------------------------------------------------------------
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      # -----------------------------------------------------------------------
      # 3. Install dependencies
      # -----------------------------------------------------------------------
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
          # Install the package itself (editable) so `import agentforge` works in
          # SUBPROCESSES too. The MCP contract tests spawn servers via
          # `python mcp_servers/x_server.py`; a subprocess's sys.path starts at the
          # script dir, not the repo root, so pytest's rootdir trick doesn't reach
          # them. (run.py / app.py require this install as well.)
          pip install -e .

      # -----------------------------------------------------------------------
      # 4. Run the full test suite
      #    --tb=short  → compact traceback on failures
      #    -v          → one line per test so you can see exactly what failed
      #
      #    Exit code: pytest exits 0 (pass) or non-zero (fail).
      #    GitHub Actions fails the job on any non-zero exit — this is the
      #    mechanism that blocks a PR merge when tests are red.
      # -----------------------------------------------------------------------
      - name: Run unit tests
        run: pytest tests/ -v --tb=short --junitxml=junit.xml

      # -----------------------------------------------------------------------
      # 5. Publish the test-count badge
      #
      #    Only on a push to main — PRs must never write to the repo, and a
      #    fork's token could not anyway.
      #
      #    The payload goes to a dedicated `badges` branch, NOT to main. Writing
      #    it to main would put a bot commit in the project history on every
      #    push and would fight branch protection once that is enabled. The
      #    branch holds exactly one generated file, so it is force-pushed as a
      #    single commit: there is no history there worth preserving.
      #
      #    Runs even if tests failed (`always()`) so a red suite produces a RED
      #    badge instead of leaving a stale green one up. `if: always()` still
      #    honours the ref/event guard below, and the job's own exit status is
      #    unaffected — a failing suite still fails CI.
      # -----------------------------------------------------------------------
      - name: Publish test-count badge
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          test -f junit.xml || { echo "no junit.xml — skipping badge"; exit 0; }
          python .github/scripts/make_tests_badge.py junit.xml > /tmp/tests.json
          echo "badge payload: $(cat /tmp/tests.json)"

          WORK="$(mktemp -d)"
          cp /tmp/tests.json "$WORK/tests.json"
          cd "$WORK"
          git init -q -b badges
          git add tests.json
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -q -m "chore(badge): publish test count [skip ci]"
          git push -q --force \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" badges
